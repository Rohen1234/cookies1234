<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grandmaster Chess Hub</title>
  <style>
    /* Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #161512;
      color: #bababa;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Header & Navigation */
    header {
      background-color: #1e1e1e;
      border-bottom: 1px solid #2a2a2a;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: #38bdf8;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 1.5rem;
    }

    nav a {
      color: #bababa;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    nav a:hover, nav a.active {
      color: #ffffff;
    }

    /* Main Container Layout */
    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1rem;
      flex: 1;
      justify-content: center;
    }

    /* Chessboard Styles */
    .board-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .player-card {
      width: 100%;
      max-width: 560px;
      background-color: #262421;
      padding: 0.75rem 1rem;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .player-info {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 600;
      color: #ffffff;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 4px;
      background-color: #38bdf8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #161512;
    }

    .timer {
      background-color: #161512;
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      font-family: monospace;
      font-size: 1.2rem;
      font-weight: bold;
      color: #ffffff;
    }

    .chessboard {
      width: 560px;
      height: 560px;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .square {
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 3.2rem;
      user-select: none;
      cursor: pointer;
    }

    .light {
      background-color: #f0d9b5;
      color: #161512;
    }

    .dark {
      background-color: #b58863;
      color: #161512;
    }

    /* Game Controls & Info Panel */
    .game-panel {
      width: 360px;
      background-color: #262421;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      height: 660px;
    }

    .panel-header {
      padding: 1.25rem;
      border-bottom: 1px solid #363431;
      font-size: 1.1rem;
      font-weight: bold;
      color: #ffffff;
    }

    .move-history {
      flex: 1;
      padding: 1rem;
      overflow-y: auto;
      font-family: monospace;
      font-size: 1rem;
    }

    .move-row {
      display: grid;
      grid-template-columns: 40px 1fr 1fr;
      padding: 0.4rem 0.5rem;
      border-radius: 4px;
    }

    .move-row:nth-child(even) {
      background-color: #1e1d1b;
    }

    .move-number {
      color: #7c7a76;
    }

    .move {
      color: #dedede;
    }

    .panel-actions {
      padding: 1.25rem;
      border-top: 1px solid #363431;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .btn {
      width: 100%;
      padding: 0.8rem;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-primary {
      background-color: #81b64c;
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: #a3d168;
    }

    .btn-secondary {
      background-color: #363431;
      color: #bababa;
    }

    .btn-secondary:hover {
      background-color: #454340;
      color: #ffffff;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 1.5rem;
      background-color: #1e1e1e;
      border-top: 1px solid #2a2a2a;
      font-size: 0.9rem;
      color: #666;
    }

    /* Mobile Responsive Adjustments */
    @media (max-width: 960px) {
      .chessboard {
        width: 100%;
        max-width: 400px;
        height: auto;
        aspect-ratio: 1 / 1;
      }
      .square {
        font-size: 2.2rem;
      }
      .game-panel {
        width: 100%;
        max-width: 400px;
        height: 400px;
      }
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <header>
    <a href="#" class="logo">
      <span>&#9812;</span> ChessHub
    </a>
    <nav>
      <ul>
        <li><a href="#" class="active">Play</a></li>
        <li><a href="#">Puzzles</a></li>
        <li><a href="#">Learn</a></li>
        <li><a href="#">Watch</a></li>
      </ul>
    </nav>
  </header>

  <!-- Main Game Section -->
  <div class="container">
    
    <!-- Left Column: Board & Player Info -->
    <div class="board-container">
      
      <!-- Opponent Info -->
      <div class="player-card">
        <div class="player-info">
          <div class="avatar">GM</div>
          <span>Grandmaster_Bot (2400)</span>
        </div>
        <div class="timer">05:00</div>
      </div>

      <!-- Chessboard Grid -->
      <div class="chessboard">
        <!-- Row 8 -->
        <div class="square light">&#9820;</div>
        <div class="square dark">&#9822;</div>
        <div class="square light">&#9821;</div>
        <div class="square dark">&#9819;</div>
        <div class="square light">&#9818;</div>
        <div class="square dark">&#9821;</div>
        <div class="square light">&#9822;</div>
        <div class="square dark">&#9820;</div>
        <!-- Row 7 -->
        <div class="square dark">&#9823;</div>
        <div class="square light">&#9823;</div>
        <div class="square dark">&#9823;</div>
        <div class="square light">&#9823;</div>
        <div class="square dark">&#9823;</div>
        <div class="square light">&#9823;</div>
        <div class="square dark">&#9823;</div>
        <div class="square light">&#9823;</div>
        <!-- Row 6 -->
        <div class="square light"></div><div class="square dark"></div>
        <div class="square light"></div><div class="square dark"></div>
        <div class="square light"></div><div class="square dark"></div>
        <div class="square light"></div><div class="square dark"></div>
        <!-- Row 5 -->
        <div class="square dark"></div><div class="square light"></div>
        <div class="square dark"></div><div class="square light"></div>
        <div class="square dark"></div><div class="square light"></div>
        <div class="square dark"></div><div class="square light"></div>
        <!-- Row 4 -->
        <div class="square light"></div><div class="square dark"></div>
        <div class="square light"></div><div class="square dark"></div>
        <div class="square light"></div><div class="square dark"></div>
        <div class="square light"></div><div class="square dark"></div>
        <!-- Row 3 -->
        <div class="square dark"></div><div class="square light"></div>
        <div class="square dark"></div><div class="square light"></div>
        <div class="square dark"></div><div class="square light"></div>
        <div class="square dark"></div><div class="square light"></div>
        <!-- Row 2 -->
        <div class="square light">&#9817;</div>
        <div class="square dark">&#9817;</div>
        <div class="square light">&#9817;</div>
        <div class="square dark">&#9817;</div>
        <div class="square light">&#9817;</div>
        <div class="square dark">&#9817;</div>
        <div class="square light">&#9817;</div>
        <div class="square dark">&#9817;</div>
        <!-- Row 1 -->
        <div class="square dark">&#9814;</div>
        <div class="square light">&#9816;</div>
        <div class="square dark">&#9815;</div>
        <div class="square light">&#9813;</div>
        <div class="square dark">&#9812;</div>
        <div class="square light">&#9815;</div>
        <div class="square dark">&#9816;</div>
        <div class="square light">&#9814;</div>
      </div>

      <!-- Player Info -->
      <div class="player-card">
        <div class="player-info">
          <div class="avatar" style="background-color: #81b64c;">YOU</div>
          <span>Player 1 (1500)</span>
        </div>
        <div class="timer">04:42</div>
      </div>

    </div>

    <!-- Right Column: Game Controls & History -->
    <div class="game-panel">
      <div class="panel-header">Live Match — Blitz 5+0</div>
      
      <div class="move-history">
        <div class="move-row">
          <span class="move-number">1.</span>
          <span class="move">e4</span>
          <span class="move">e5</span>
        </div>
        <div class="move-row">
          <span class="move-number">2.</span>
          <span class="move">Nf3</span>
          <span class="move">Nc6</span>
        </div>
        <div class="move-row">
          <span class="move-number">3.</span>
          <span class="move">Bc4</span>
          <span class="move">Nf6</span>
        </div>
        <div class="move-row">
          <span class="move-number">4.</span>
          <span class="move">d3</span>
          <span class="move">Be7</span>
        </div>
      </div>

      <div class="panel-actions">
        <button class="btn btn-primary">New Game</button>
        <button class="btn btn-secondary">Resign / Draw</button>
      </div>
    </div>

  </div>

  <!-- Footer -->
  <footer>
    &copy; 2026 ChessHub. Built with pure HTML & CSS.
  </footer>

</body>
</html>
